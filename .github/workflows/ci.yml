name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@423faa6daba67a25c9e4d9c9c9fba4e7933a0f0b # v6.0.0
        with:
          python-version: "3.12"
      - name: Run organ contract tests
        run: |
          python -m unittest discover -s tests -v
