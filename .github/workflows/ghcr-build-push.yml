name: GHCR Build + Push (immutable commit SHA)
# Builds the root Dockerfile, pushes it by immutable digest, signs (keyless,
# legacy OCI signature so cosign v2/v3 verifiers can read it), attests, and
# verifies that digest against the exact workflow identity that the
# szl-build-env supply-chain gate requires. Publishes only for protected main.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ghcr-protected-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/szl-holdings/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Attest build provenance (GitHub Attestations API + Rekor)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # installer v4.1.2; Cosign v3.0.6
      - name: Sign and verify immutable digest (keyless)
        id: signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build-push.outputs.digest }}"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="${IMAGE}@${DIGEST}"
          IDENTITY="${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"

          # Emit the interoperable legacy OCI signature object explicitly so the
          # szl-build-env admission gate (cosign verify with certificate
          # identity) can read this signature.
          cosign sign --yes \
            --upload=true \
            --new-bundle-format=false \
            --use-signing-config=false \
            --registry-referrers-mode=legacy \
            "${REF}"

          cosign verify \
            --new-bundle-format=false \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-ref="${GITHUB_REF}" \
            --certificate-github-workflow-sha="${GITHUB_SHA}" \
            --certificate-github-workflow-trigger="push" \
            "${REF}" | tee cosign-verify.json
          jq -e 'type == "array" and length > 0' cosign-verify.json > /dev/null

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "signature_count=$(jq 'length' cosign-verify.json)" >> "${GITHUB_OUTPUT}"
          {
            echo "### GHCR signature gate"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Signed reference: `%s`\n' "${REF}"
            printf -- '- Certificate identity: `%s`\n' "${IDENTITY}"
            printf -- '- OIDC issuer: `%s`\n' "https://token.actions.githubusercontent.com"
            printf -- '- Verified signatures: `%s`\n' "$(jq 'length' cosign-verify.json)"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: cosign attest SLSA provenance (registry, cosign-verifiable)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMG="ghcr.io/szl-holdings/${{ github.event.repository.name }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"
          cat > predicate.json <<EOF
          {
            "builder": {
              "id": "${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"
            },
            "buildType": "https://actions.github.io/buildtypes/workflow/v1",
            "invocation": {
              "configSource": {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/ghcr-build-push.yml"
              },
              "environment": {
                "event_name": "${{ github.event_name }}",
                "repository_id": "${{ github.repository_id }}"
              }
            },
            "buildVersion": "${{ github.sha }}",
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}",
              "completeness": { "parameters": true, "environment": true, "materials": true },
              "reproducible": false
            }
          }
          EOF
          cosign attest --yes --predicate predicate.json --type slsaprovenance \
            "${IMG}@${DIGEST}"
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMG}@${DIGEST}" > /dev/null
